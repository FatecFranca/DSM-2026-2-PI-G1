<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#283e3b" />
    <title>Usuários · Tia Lari Banho e Tosa</title>
    <link rel="icon" href="assets/images/logo.png" type="image/png" />
    <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
    <script
      defer
      src="assets/vendor/bootstrap/bootstrap.bundle.min.js"
    ></script>
    <script defer src="assets/js/components/ui.js"></script>
    <script defer src="assets/js/components/layout.js"></script>
    <script defer src="assets/js/services/store.js"></script>
    <script defer src="assets/js/pages/usuarios.js"></script>
  </head>
  <body data-page="usuarios" data-breadcrumb="Cadastros / Usuários">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div id="app-sidebar"></div>
    <div class="workspace">
      <div class="tl-container">
        <div id="app-header"></div>
        <main id="main-content" tabindex="-1">
          <header class="page-heading row-between">
            <div>
              <h1>Usuários</h1>
              <p class="lead">
                Equipe autorizada a acessar e operar o sistema.
              </p>
            </div>
            <button
              class="btn btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#user-modal"
            >
              <span data-icon="plus"></span>Novo usuário
            </button>
          </header>
          <section class="rule-note">
            <span data-icon="info"></span>
            <div>
              Somente usuários <strong>ativos</strong> podem ser selecionados
              como responsáveis por novos agendamentos.
            </div>
          </section>
          <section class="summary-grid" id="user-metrics"></section>
          <section class="card data-card section">
            <div class="panel-head">
              <div class="module-toolbar mb-0">
                <div class="toolbar-grow">
                  <label class="form-label" for="user-search"
                    >Buscar usuário</label
                  ><input
                    class="form-control input"
                    id="user-search"
                    type="search"
                    placeholder="Nome ou e-mail"
                  />
                </div>
                <div class="toolbar-field">
                  <label class="form-label" for="user-role">Função</label
                  ><select class="form-select input" id="user-role">
                    <option value="">Todas</option>
                    <option>Administrador</option>
                    <option>Atendimento</option>
                    <option>Banho e Tosa</option>
                  </select>
                </div>
                <div class="toolbar-field">
                  <label class="form-label" for="user-status">Status</label
                  ><select class="form-select input" id="user-status">
                    <option value="">Todos</option>
                    <option>Ativo</option>
                    <option>Inativo</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="table-wrap">
              <table class="ds-table table">
                <thead>
                  <tr>
                    <th>Usuário</th>
                    <th>Função</th>
                    <th>Telefone</th>
                    <th>Status</th>
                    <th class="text-end">Ações</th>
                  </tr>
                </thead>
                <tbody id="users-table"></tbody>
              </table>
            </div>
          </section>
          <div
            class="modal fade page-modal"
            id="user-modal"
            tabindex="-1"
            aria-labelledby="user-modal-title"
            aria-hidden="true"
          >
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content">
                <form id="user-form" class="needs-validation" novalidate>
                  <div class="modal-header">
                    <h2 class="modal-title fs-4" id="user-modal-title">
                      Cadastrar usuário
                    </h2>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Fechar"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <div class="row g-3">
                      <div class="col-12">
                        <label class="form-label" for="user-name"
                          >Nome completo *</label
                        ><input
                          class="form-control input"
                          id="user-name"
                          name="name"
                          required
                          minlength="3"
                        />
                      </div>
                      <div class="col-12">
                        <label class="form-label" for="user-email"
                          >E-mail *</label
                        ><input
                          class="form-control input"
                          id="user-email"
                          name="email"
                          type="email"
                          required
                        />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label" for="user-phone"
                          >Telefone *</label
                        ><input
                          class="form-control input"
                          id="user-phone"
                          name="phone"
                          required
                        />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label" for="user-role-form"
                          >Função *</label
                        ><select
                          class="form-select input"
                          id="user-role-form"
                          name="role"
                          required
                        >
                          <option value="">Selecione</option>
                          <option>Administrador</option>
                          <option>Atendimento</option>
                          <option>Banho e Tosa</option>
                        </select>
                      </div>
                    </div>
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-outline-primary"
                      data-bs-dismiss="modal"
                    >
                      Cancelar</button
                    ><button type="submit" class="btn btn-primary">
                      Salvar usuário
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </main>
        <footer class="footer-note">
          Tia Lari Banho e Tosa · Gestão interna · Ambiente de demonstração
        </footer>
      </div>
    </div>
    <div id="app-feedback"></div>
  </body>
</html>
